title = "Article"
description = "A blog post or article: the angle and the structure."

[[approaches]]
id = "how-to-guide"
name = "How-to guide"
how = "Teach one task step by step so the reader can repeat it, with the result they should see after each step."

[[approaches]]
id = "case-study"
name = "Case study"
how = "Follow one real case through the problem, the choices made and the result."

[[approaches]]
id = "contrarian"
name = "Contrarian view"
how = "Argue against a common belief with evidence and a fair counterpoint."

[[approaches]]
id = "list-article"
name = "List article"
how = "Group the topic into separate items, each with its own point and example."

[[approaches]]
id = "explainer"
name = "Explainer"
how = "Explain one concept in plain terms with an analogy the reader already knows."

[[approaches]]
id = "lessons-learned"
name = "Lessons learned"
how = "Look back at a project or a year and say what held up and what did not."

[[approaches]]
id = "comparison"
name = "Comparison"
how = "Put two or three options side by side on the points that matter and say which fits whom."

[[approaches]]
id = "data-story"
name = "Data story"
how = "Build the argument on one dataset or measurement and what it shows."

[[approaches]]
id = "pyramid"
name = "Answer first"
how = "State your conclusion up front, then give three supporting reasons, each backed by one fact or example."

[[approaches]]
id = "situation-complication"
name = "Situation and complication"
how = "Lay out the situation readers know, the complication that breaks it, the question that raises, and your answer."

[[approaches]]
id = "postmortem"
name = "Postmortem"
how = "Reconstruct a failure: what happened in time order, the root cause, what you changed, and what is still unresolved."

[[approaches]]
id = "faq"
name = "Questions and answers"
how = "Answer the five questions people really ask about the topic, each under its own heading with the direct answer first."

