title = "Product update"
description = "A product update or release note."

[[approaches]]
id = "what-changed"
name = "What changed"
how = "Say plainly what is different now and who it affects."

[[approaches]]
id = "problem-solved"
name = "Problem solved"
how = "Describe the problem users had and how the change fixes it."

[[approaches]]
id = "before-after"
name = "Before and after"
how = "Show the same task before the change and after it."

[[approaches]]
id = "why-we-built-it"
name = "Why we built it"
how = "Explain the reason behind the change, including what you tried before."

[[approaches]]
id = "how-to-use-it"
name = "How to use it"
how = "Show the shortest path to using the new feature."

[[approaches]]
id = "user-driven"
name = "User driven"
how = "Credit the feedback that led to the change and show how it was used."

[[approaches]]
id = "by-the-numbers"
name = "By the numbers"
how = "Put one measured result at the centre, such as speed or error rate."

[[approaches]]
id = "known-limits"
name = "Known limits"
how = "Say what works now, what does not yet, and what comes next."

[[approaches]]
id = "grouped-changes"
name = "Grouped changes"
how = "Group the changes under new, improved and fixed, one line each, ordered by how many users each affects."

[[approaches]]
id = "action-needed"
name = "Action needed"
how = "Lead with what the reader must do after upgrading, if anything, then list what changed."

[[approaches]]
id = "bug-story"
name = "Bug story"
how = "Explain one bug: what users saw, what caused it, and how the fix works."

[[axes.opener]]
id = "version"
hint = "the version or date"

