title = "Video script"
description = "A script for a short video."

[[approaches]]
id = "story"
name = "Story"
how = "Tell one small thing that happened, with a clear turn in the middle."

[[approaches]]
id = "myth-busting"
name = "Myth buster"
how = "Name a common belief, then show on screen where it fails."

[[approaches]]
id = "how-to"
name = "How-to"
how = "Show one small task being done, step by step."

[[approaches]]
id = "listicle"
name = "List"
how = "Give three or four items, each with one clear point and one visual."

[[approaches]]
id = "before-after"
name = "Before and after"
how = "Show the same situation before and after the change."

[[approaches]]
id = "lesson-learned"
name = "Lesson learned"
how = "Share one mistake or surprise and what you do differently now."

[[approaches]]
id = "behind-the-scenes"
name = "Behind the scenes"
how = "Show how the work really gets done, including the messy part."

[[approaches]]
id = "reaction"
name = "Reaction"
how = "React to a clip, post or comment shown on screen with your own view."

[[approaches]]
id = "experiment"
name = "Experiment"
how = "Run one test on camera: say what you expect, then show what actually happened."

[[approaches]]
id = "common-mistakes"
name = "Common mistakes"
how = "Name three mistakes people make at one task, with the fix for each shown on screen."

[[approaches]]
id = "pov-scene"
name = "Both sides of a scene"
how = "Play both people in a familiar situation so the viewer recognises themselves, then show the better way."

[[approaches]]
id = "viewer-question"
name = "Viewer question"
how = "Answer one question a viewer sent, say who asked, and show the answer instead of describing it."

